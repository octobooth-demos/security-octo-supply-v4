<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Launcher</title>
  <style>
    :root { color-scheme: light dark; --canvas-background: #fff; --canvas-subtle: #f6f8fa; --canvas-text: #1f2328; --canvas-muted: #59636e; --canvas-border: #d1d9e0; --canvas-link: #0969da; --canvas-success: #1a7f37; --canvas-error: #cf222e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background-color-default, var(--canvas-background)); color: var(--text-color-default, var(--canvas-text)); font: var(--text-body-medium, 14px)/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); }
    main { max-width: 820px; margin: 0 auto; padding: 28px 24px; }
    h1 { font-size: 24px; line-height: 1.25; font-weight: var(--font-weight-semibold, 600); margin: 0; letter-spacing: -.02em; }
    h2 { font-size: 16px; font-weight: 600; margin: 0; }
    p { margin: 8px 0 0; color: var(--text-color-muted, var(--canvas-muted)); }
    .heading { display: flex; align-items: center; gap: 12px; }
    .mark { width: 28px; height: 28px; flex: none; fill: currentColor; }
    .description { max-width: 70ch; margin-top: 12px; }
    .demo-heading { font-size: 22px; line-height: 1.3; margin-top: 24px; }
    [hidden] { display: none !important; }
    .bulk-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    button, .session-link { display: inline-flex; justify-content: center; align-items: center; min-height: 34px; padding: 5px 12px; font: inherit; font-weight: 500; border: 1px solid var(--border-color-default, var(--canvas-border)); border-radius: 6px; cursor: pointer; text-decoration: none; background: var(--background-color-default, var(--canvas-background)); color: var(--text-color-default, var(--canvas-text)); }
    button:hover, .session-link:hover { background: var(--background-color-subtle, var(--canvas-subtle)); }
    button:active { background: var(--background-color-muted, var(--canvas-subtle)); }
    .primary { background: var(--true-color-green, #1f883d); color: var(--color-white, #fff); border-color: transparent; }
    .primary:hover { background: var(--true-color-green, #1f883d); filter: brightness(.93); }
    button:disabled { opacity: .55; cursor: not-allowed; filter: none; }
    button[aria-busy="true"]::before { content: ""; width: 12px; height: 12px; margin-right: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: launch-spin .8s linear infinite; }
    @keyframes launch-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { button[aria-busy="true"]::before { animation: none; } }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--color-focus-outline, #0969da); outline-offset: 3px; }
    #tasks { border: 1px solid var(--border-color-default, var(--canvas-border)); border-radius: 6px; overflow: hidden; }
    article { padding: 18px 20px; }
    article + article { border-top: 1px solid var(--border-color-default, var(--canvas-border)); }
    .task-heading { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .task-heading h2 { flex: 1; overflow-wrap: anywhere; }
    .task-heading .badge { flex: none; }
    .prompt-card { margin-bottom: 14px; border: 1px solid var(--true-color-purple, #8250df); border-radius: 8px; overflow: hidden; }
    .prompt-toolbar { display: flex; min-height: 36px; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 4px 12px; border-bottom: 1px solid var(--true-color-purple, #8250df); color: var(--true-color-purple, #8250df); font-size: 12px; font-weight: 600; }
    .prompt-label { display: inline-flex; align-items: center; gap: 7px; }
    .prompt-icon { display: block; width: 16px; height: 16px; flex: none; fill: currentColor; }
    .copy-prompt { min-height: 26px; padding: 2px 8px; border-color: var(--true-color-purple, #8250df); color: var(--true-color-purple, #8250df); font-size: 12px; }
    .prompt-card pre { margin: 0; padding: 14px 16px; color: var(--text-color-default, var(--canvas-text)); font: 13px/1.6 var(--font-mono, ui-monospace, monospace); white-space: pre-wrap; overflow-wrap: anywhere; }
    code { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; overflow-wrap: anywhere; }
    .file-reference { display: inline; padding: 2px 5px; border-radius: 4px; background: var(--background-color-subtle, var(--canvas-subtle)); font: inherit; }
    #status { display: block; margin: 12px 0; color: var(--text-color-muted, var(--canvas-muted)); }
    #status:empty { display: none; }
    #status[data-tone="error"] { color: var(--true-color-red, var(--canvas-error)); }
    #status[data-tone="success"] { color: var(--canvas-success); }
    .task-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .session-meta { font-size: 12px; }
    .session-link { flex: none; color: var(--true-color-blue, var(--canvas-link)); font-size: 12px; }
    details { margin-top: 6px; font-size: 12px; }
    summary { cursor: pointer; color: var(--text-color-muted, var(--canvas-muted)); }
    details pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 480px) {
      main { padding: 20px 16px; }
      h1 { font-size: 21px; }
      article { padding: 16px; }
      .prompt-card pre { padding: 12px; }
      .task-heading { flex-wrap: wrap; }
      .task-heading h2 { flex-basis: 100%; order: 1; }
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-color-mode="light"]) { --canvas-background: #0d1117; --canvas-subtle: #161b22; --canvas-border: #3d444d; --canvas-text: #f0f6fc; --canvas-muted: #9198a1; --canvas-link: #4493f8; --canvas-success: #3fb950; --canvas-error: #f85149; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="heading">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1C5.923 1 1 5.923 1 12c0 4.867 3.149 8.979 7.521 10.436.55.096.756-.233.756-.522 0-.262-.013-1.128-.013-2.049-2.764.509-3.479-.674-3.699-1.292-.124-.317-.66-1.293-1.128-1.554-.385-.207-.936-.715-.014-.729.866-.014 1.485.797 1.691 1.128.99 1.663 2.571 1.196 3.204.907.096-.715.385-1.196.701-1.471-2.448-.275-5.005-1.224-5.005-5.432 0-1.197.426-2.187 1.128-2.957-.11-.275-.495-1.402.11-2.915 0 0 .921-.288 3.024 1.128a10.193 10.193 0 0 1 2.75-.371c.936 0 1.871.123 2.75.371 2.104-1.43 3.025-1.128 3.025-1.128.605 1.513.22 2.64.11 2.915.701.77 1.127 1.747 1.127 2.957 0 4.222-2.571 5.157-5.019 5.432.399.344.743 1.004.743 2.035 0 1.471-.014 2.654-.014 3.025 0 .289.206.632.756.522C19.851 20.979 23 16.854 23 12c0-6.077-4.922-11-11-11Z"/></svg>
        <h1>Demo Launcher</h1>
      </div>
      <h2 id="demo-title" class="demo-heading">Loading demo</h2>
      <p id="description" class="description">Choose a subsession to launch.</p>
      <output id="status" role="status" aria-live="polite"></output>
    </header>
    <div id="tasks" aria-label="Demo tasks"></div>
    <div class="bulk-actions">
      <button id="launch" class="primary" disabled hidden>Launch all HydraFusion subsessions</button>
    </div>
  </main>
  <script type="module">
    const button = document.querySelector("#launch");
    const status = document.querySelector("#status");
    const taskResults = new Map();
    const buttons = [button];
    let submitting = false;
    let polling = false;
    let watching = false;
    let busyControl = button;
    function setBusy(busy) {
      for (const control of buttons) {
        control.disabled = busy;
        control.setAttribute("aria-busy", String(busy && control === busyControl));
      }
    }
    function message(text, tone = "") {
      status.textContent = text;
      status.dataset.tone = tone;
    }
    async function refresh() {
      const data = await request("state");
      showState(data.state, data.running);
      watching = data.running;
      if (!submitting) busyControl = taskResults.get(data.state.pending)?.control || button;
      setBusy(submitting || data.running);
      return data;
    }
    async function launch(taskName) {
      submitting = true;
      busyControl = taskResults.get(taskName)?.control || button;
      setBusy(true);
      message("Creating worktree sessions...");
      try {
        const path = taskName === undefined ? "launch" : `launch?task=${encodeURIComponent(taskName)}`;
        showState(await request(path, {
          method: "POST",
          headers: { "X-Launcher-Token": location.pathname.split("/")[1] },
        }));
      } catch (error) {
        try { await refresh(); } catch (readError) {
          message(`${error.message} Launch results could not be read: ${readError.message}. Check the App session list before trying again.`, "error");
          return;
        }
        message(`${error.message} Some sessions may already exist; check the links below or the App session list before trying again.`, "error");
      } finally {
        submitting = false;
        setBusy(false);
      }
    }
    async function request(path, options) {
      const response = await fetch(new URL(path, location.href), options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);
      return data;
    }
    function safeSessionUrl(entry) {
      const url = entry.url || entry.result?.match(/\bghapp:\/\/sessions\/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\b/i)?.[0];
      return typeof url === "string" && /^ghapp:\/\/sessions\/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(url) ? url : undefined;
    }
    function showState(state, running = false) {
      const entries = state.sessions || [];
      const latest = state.latestSessions || entries;
      for (const [taskName, { container, control }] of taskResults) {
        container.replaceChildren(control);
        const mode = taskName.match(/^\[HydraFusion(?: - |\-)(Single|Cascade|Critique)\]/)?.[1];
        const entry = latest.find((candidate) =>
          candidate.name === taskName || (mode && (
            candidate.name.startsWith(`[HydraFusion-${mode}] `) ||
            candidate.name.startsWith(`[HydraFusion - ${mode}] `) ||
            candidate.name.startsWith(`${mode} - HydraFusion:`))));
        control.textContent = entry ? "Relaunch Subsession" : "Launch Subsession";
        if (!entry) {
          continue;
        }
        const url = safeSessionUrl(entry);
        if (url) {
          const link = document.createElement("a");
          link.className = "session-link";
          link.href = url;
          link.target = "_top";
          link.textContent = "Open Session";
          link.setAttribute("aria-label", `Open ${entry.name}`);
          container.append(link);
        } else {
          const meta = document.createElement("p");
          meta.className = "session-meta";
          meta.textContent = "Created. Open from the App session list; no session link was returned.";
          container.append(meta);
          if (entry.result) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = "App response";
            const response = document.createElement("pre");
            response.textContent = entry.result;
            details.append(summary, response);
            container.append(details);
          }
        }
      }
      if (state.status === "error") {
        message(`${state.error || "Launch failed."} ${entries.length} session(s) confirmed. Check these results before starting another launch.`, "error");
      } else if (running) {
        message(state.pending ? `Creating ${state.pending}...` : "Creating worktree sessions...");
      } else if (state.status === "running") {
        message("The previous launch was interrupted. Check the confirmed sessions below and the App session list before launching again.", "error");
      } else if (state.status === "forwarded") {
        message("Preparation sent to the coordinating agent. Session creation is not yet confirmed.");
      } else if (state.status === "created") {
        message("");
      } else {
        message("No sessions launched yet. Choose a task above to get started.");
      }
    }
    function renderPrompt(prompt) {
      const card = document.createElement("section");
      card.className = "prompt-card";
      const toolbar = document.createElement("div");
      toolbar.className = "prompt-toolbar";
      const label = document.createElement("span");
      label.className = "prompt-label";
      const svgNamespace = "http://www.w3.org/2000/svg";
      const icon = document.createElementNS(svgNamespace, "svg");
      icon.setAttribute("class", "prompt-icon");
      icon.setAttribute("viewBox", "0 0 16 16");
      icon.setAttribute("aria-hidden", "true");
      // Primer Octicons copilot-16: https://github.com/primer/octicons/blob/main/icons/copilot-16.svg
      for (const path of [
        "M7.998 15.035c-4.562 0-7.873-2.914-7.998-3.749V9.338c.085-.628.677-1.686 1.588-2.065.013-.07.024-.143.036-.218.029-.183.06-.384.126-.612-.201-.508-.254-1.084-.254-1.656 0-.87.128-1.769.693-2.484.579-.733 1.494-1.124 2.724-1.261 1.206-.134 2.262.034 2.944.765.05.053.096.108.139.165.044-.057.094-.112.143-.165.682-.731 1.738-.899 2.944-.765 1.23.137 2.145.528 2.724 1.261.566.715.693 1.614.693 2.484 0 .572-.053 1.148-.254 1.656.066.228.098.429.126.612.012.076.024.148.037.218.924.385 1.522 1.471 1.591 2.095v1.872c0 .766-3.351 3.795-8.002 3.795Zm0-1.485c2.28 0 4.584-1.11 5.002-1.433V7.862l-.023-.116c-.49.21-1.075.291-1.727.291-1.146 0-2.059-.327-2.71-.991A3.222 3.222 0 0 1 8 6.303a3.24 3.24 0 0 1-.544.743c-.65.664-1.563.991-2.71.991-.652 0-1.236-.081-1.727-.291l-.023.116v4.255c.419.323 2.722 1.433 5.002 1.433ZM6.762 2.83c-.193-.206-.637-.413-1.682-.297-1.019.113-1.479.404-1.713.7-.247.312-.369.789-.369 1.554 0 .793.129 1.171.308 1.371.162.181.519.379 1.442.379.853 0 1.339-.235 1.638-.54.315-.322.527-.827.617-1.553.117-.935-.037-1.395-.241-1.614Zm4.155-.297c-1.044-.116-1.488.091-1.681.297-.204.219-.359.679-.242 1.614.091.726.303 1.231.618 1.553.299.305.784.54 1.638.54.922 0 1.28-.198 1.442-.379.179-.2.308-.578.308-1.371 0-.765-.123-1.242-.37-1.554-.233-.296-.693-.587-1.713-.7Z",
        "M6.25 9.037a.75.75 0 0 1 .75.75v1.501a.75.75 0 0 1-1.5 0V9.787a.75.75 0 0 1 .75-.75Zm4.25.75v1.501a.75.75 0 0 1-1.5 0V9.787a.75.75 0 0 1 1.5 0Z",
      ]) {
        const glyph = document.createElementNS(svgNamespace, "path");
        glyph.setAttribute("d", path);
        icon.append(glyph);
      }
      label.append(icon, document.createTextNode("Copilot prompt"));
      const copy = document.createElement("button");
      copy.className = "copy-prompt";
      copy.type = "button";
      copy.textContent = "Copy prompt";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(prompt);
          copy.textContent = "Copied!";
          setTimeout(() => { copy.textContent = "Copy prompt"; }, 1600);
        } catch (error) {
          copy.textContent = "Copy failed";
          message(`Could not copy prompt: ${error.message}`, "error");
        }
      });
      toolbar.append(label, copy);
      const pre = document.createElement("pre");
      const codeBlock = document.createElement("code");
      codeBlock.className = "language-prompt";
      const references = /<copilot-ref kind="file" target-id="([^"]+)" label="([^"]+)" \/>/g;
      let offset = 0;
      for (const match of prompt.matchAll(references)) {
        codeBlock.append(document.createTextNode(prompt.slice(offset, match.index)));
        const file = document.createElement("span");
        file.className = "file-reference";
        file.textContent = match[2];
        file.title = match[1];
        codeBlock.append(file);
        offset = match.index + match[0].length;
      }
      codeBlock.append(document.createTextNode(prompt.slice(offset)));
      pre.append(codeBlock);
      card.append(toolbar, pre);
      return card;
    }
    try {
      const data = await request("state");
      document.querySelector("#demo-title").textContent = data.title;
      document.querySelector("#description").textContent = data.description;
      button.hidden = !data.allowBulkLaunch;
      if (data.route === "agent") button.textContent = "Prepare all HydraFusion subsessions";
      for (const task of data.tasks) {
        const article = document.createElement("article");
        const header = document.createElement("div");
        header.className = "task-heading";
        const heading = document.createElement("h2");
        heading.textContent = task.name.replace(/^\[HydraFusion(?: - |\-)(Single|Cascade|Critique)\] /, "[$1] ");
        header.append(heading);
        article.append(header, renderPrompt(task.prompt));
        const taskButton = document.createElement("button");
        taskButton.textContent = "Launch Subsession";
        taskButton.className = "primary";
        taskButton.setAttribute("aria-label", `Launch ${task.name}`);
        taskButton.addEventListener("click", () => launch(task.name));
        buttons.push(taskButton);
        const result = document.createElement("div");
        result.className = "task-actions";
        result.setAttribute("aria-label", `Actions for ${task.name}`);
        result.append(taskButton);
        taskResults.set(task.name, { container: result, control: taskButton });
        article.append(result);
        document.querySelector("#tasks").append(article);
      }
      showState(data.state, data.running);
      watching = data.running;
      busyControl = taskResults.get(data.state.pending)?.control || button;
      setBusy(data.running);
    } catch (error) {
      message(error.message, "error");
    }
    button.addEventListener("click", () => launch());
    setInterval(async () => {
      if (polling || (!submitting && !watching)) return;
      polling = true;
      try { await refresh(); } catch (error) {
        message(`Could not refresh launch results: ${error.message}`, "error");
      } finally { polling = false; }
    }, 3000);
  </script>
</body>
</html>
